name: test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LuaJIT
        run: sudo apt-get update && sudo apt-get install -y luajit

      - name: Run tests (signed bit)
        run: luajit tests/run.lua

      - name: Run tests (unsigned bit, as the client)
        run: luajit tests/run.lua --unsigned

      - name: Run UI smoke test
        run: |
          if [ -f tests/smoke_ui.lua ]; then
            luajit tests/smoke_ui.lua
          else
            echo "tests/smoke_ui.lua not present, skipping"
          fi

      - name: Run network smoke test
        run: luajit tests/smoke_net.lua

      - name: Run guild mode smoke test
        run: luajit tests/smoke_guild.lua

      - name: Run witnessed account smoke test
        run: luajit tests/smoke_witness.lua

      - name: Run payout smoke test
        run: luajit tests/smoke_payout.lua

      - name: Run guild bank smoke test
        run: luajit tests/smoke_bank.lua

      - name: Regenerate test vectors and check for drift
        run: |
          if [ -f tools/ref/gen_vectors.py ]; then
            python3 tools/ref/gen_vectors.py
            git diff --exit-code tests/vectors.lua
          else
            echo "tools/ref/gen_vectors.py not present, skipping"
          fi
